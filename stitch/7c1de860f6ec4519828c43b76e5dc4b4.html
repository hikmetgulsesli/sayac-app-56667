<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAYAÇ - Mobil Düzen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    colors: {
                        "surface-container-highest": "#2d3449",

                        "on-tertiary-fixed": "#3d0026",
                        "surface-tint": "#bdc2ff",
                        "on-secondary": "#381385",
                        "secondary-fixed": "#e8ddff",
                        "surface-container-high": "#222a3d",
                        "inverse-primary": "#4953bc",
                        "on-primary": "#131e8c",
                        "surface-variant": "#2d3449",
                        "secondary-container": "#4f319c",
                        "inverse-on-surface": "#283044",
                        "primary-fixed": "#e0e0ff",
                        "surface-container-lowest": "#060e20",
                        "on-error": "#690005",
                        "on-surface": "#dae2fd",
                        "outline-variant": "#454653",
                        "inverse-surface": "#dae2fd",
                        "on-primary-fixed-variant": "#2f3aa3",
                        "background": "#0b1326",
                        "primary": "#bdc2ff",
                        "secondary": "#cebdff",
                        "primary-container": "#818cf8",
                        "surface-container-low": "#131b2e",
                        "surface-dim": "#0b1326",
                        "surface": "#0b1326",
                        "tertiary-fixed": "#ffd8e7",
                        "on-primary-container": "#101b8a",
                        "on-background": "#dae2fd",
                        "on-primary-fixed": "#000767",
                        "secondary-fixed-dim": "#cebdff",
                        "on-surface-variant": "#c6c5d5",
                        "primary-fixed-dim": "#bdc2ff",
                        "tertiary-container": "#e869ac",
                        "on-secondary-fixed-variant": "#4f319c",
                        "surface-container": "#171f33",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#85145a",
                        "surface-bright": "#31394d",
                        "outline": "#908f9e",

                        "on-tertiary": "#620040",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffafd3",
                        "tertiary": "#ffafd3"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        };

<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: theme('fontFamily.body');
        }
        
        .counter-text {
            font-family: theme('fontFamily.display');
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            color: theme('colors.on-surface');
        }
        
        .gradient-text {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col pb-24 md:pb-0">
<!-- Top Navigation (Web Only, Hidden on Mobile per rules) -->
<header class="hidden md:flex justify-between items-center w-full px-6 h-16 max-w-screen-xl mx-auto bg-[#131b2e] no-border top-0 full-width docked">
<div class="text-2xl font-bold tracking-tighter text-[#dae2fd] font-['Space_Grotesk']">SAYAÇ</div>
<nav class="flex gap-6">
<a class="text-[#bdc2ff] font-bold hover:bg-[#171f33] transition-colors duration-200 px-3 py-2 rounded-md" href="#">Sayaç</a>
<a class="text-[#454653] hover:bg-[#171f33] transition-colors duration-200 px-3 py-2 rounded-md" href="#">İstatistikler</a>
<a class="text-[#454653] hover:bg-[#171f33] transition-colors duration-200 px-3 py-2 rounded-md" href="#">Ayarlar</a>
</nav>
<div class="flex gap-4">
<button class="text-[#818cf8] hover:bg-[#171f33] transition-colors duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-[#818cf8] hover:bg-[#171f33] transition-colors duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
</div>
</header>
<!-- Mobile Header Container (For Visual Balance) -->
<div class="md:hidden flex justify-between items-center p-6 w-full">
<div class="font-headline font-semibold text-2xl text-on-surface">Günlük Su</div>
<button class="text-primary-container p-2 rounded-full bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-6 w-full max-w-md mx-auto">
<!-- Counter Section -->
<section class="flex flex-col items-start mt-8 mb-12 relative w-full">
<div class="absolute top-0 right-0 bg-surface-container-low px-4 py-2 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="flag">flag</span>
<span class="font-label text-sm font-medium text-on-surface-variant">Hedef: 2500</span>
</div>
<div class="mt-12 flex flex-col w-full text-left">
<span class="counter-text ml-[-4px]">1450</span>
<span class="font-headline text-2xl text-primary-container mt-[-8px]">ml</span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-low h-3 rounded-full mt-8 overflow-hidden">
<div class="bg-gradient-to-r from-primary to-primary-container h-full rounded-full" style="width: 58%;"></div>
</div>
</section>
<!-- Controls Section (Thumb Reachable) -->
<section class="grid grid-cols-2 gap-4 w-full mb-12">
<!-- Artır (Primary) -->
<button class="col-span-2 bg-gradient-to-br from-primary to-primary-container rounded-xl py-6 flex flex-col items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-[0px_20px_40px_rgba(0,0,0,0.25)]">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-headline font-semibold text-xl text-on-primary-container">Artır (+250)</span>
</button>
<!-- Azalt (Secondary) -->
<button class="bg-secondary-container rounded-xl py-4 flex items-center justify-center gap-2 hover:bg-opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="remove">remove</span>
<span class="font-label font-medium text-on-secondary-container">Azalt (-250)</span>
</button>
<!-- Sıfırla (Tertiary) -->
<button class="border border-outline-variant/30 rounded-xl py-4 flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined text-tertiary" data-icon="refresh">refresh</span>
<span class="font-label font-medium text-tertiary">Sıfırla</span>
</button>
</section>
<!-- History Section (Glassmorphism concept) -->
<section class="w-full flex-1 mb-8">
<h2 class="font-headline font-semibold text-lg text-on-surface mb-4">Son Kayıtlar</h2>
<div class="bg-surface-container/60 backdrop-blur-xl rounded-lg p-2 flex flex-col gap-2 relative z-10 border border-outline-variant/10">
<!-- History Item 1 -->
<div class="flex justify-between items-center bg-surface-container-low rounded-md p-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" data-icon="water_drop">water_drop</span>
</div>
<div>
<p class="font-label font-medium text-on-surface">Su İçildi</p>
<p class="font-label text-xs text-on-surface-variant">14:30</p>
</div>
</div>
<span class="font-headline font-bold text-primary">+250 ml</span>
</div>
<!-- History Item 2 -->
<div class="flex justify-between items-center bg-surface-container-low rounded-md p-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" data-icon="water_drop">water_drop</span>
</div>
<div>
<p class="font-label font-medium text-on-surface">Su İçildi</p>
<p class="font-label text-xs text-on-surface-variant">12:15</p>
</div>
</div>
<span class="font-headline font-bold text-primary">+500 ml</span>
</div>
<!-- History Item 3 -->
<div class="flex justify-between items-center bg-surface-container-low rounded-md p-4 opacity-70">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" data-icon="water_drop">water_drop</span>
</div>
<div>
<p class="font-label font-medium text-on-surface">Su İçildi</p>
<p class="font-label text-xs text-on-surface-variant">09:00</p>
</div>
</div>
<span class="font-headline font-bold text-primary">+700 ml</span>
</div>
<button class="w-full text-center py-2 mt-2 font-label text-sm text-primary-container hover:text-primary transition-colors">
                    Tüm Geçmişi Gör
                </button>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (Mobile Only per rules) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 z-50 rounded-t-[2rem] bg-[#0b1326]/80 backdrop-blur-xl shadow-[0px_-10px_40px_rgba(0,0,0,0.3)] tonal shift via bg-[#131b2e]">
<!-- Tab 1 (Active) -->
<a class="flex flex-col items-center justify-center bg-[#818cf8]/10 text-[#bdc2ff] rounded-[1.5rem] px-5 py-2 transition-all" href="#" style="transform: scale(1.1); transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="text-[12px] font-medium Inter uppercase tracking-widest">Sayaç</span>
</a>
<!-- Tab 2 (Inactive) -->
<a class="flex flex-col items-center justify-center text-[#454653] px-5 py-2 hover:text-[#818cf8] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="leaderboard">leaderboard</span>
<span class="text-[12px] font-medium Inter uppercase tracking-widest">İstatistikler</span>
</a>
<!-- Tab 3 (Inactive) -->
<a class="flex flex-col items-center justify-center text-[#454653] px-5 py-2 hover:text-[#818cf8] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="text-[12px] font-medium Inter uppercase tracking-widest">Ayarlar</span>
</a>
</nav>
</body></html>
